# Render deployment config for the headless JARVIS core only — the
# tool-execution API, Agent Orchestrator API, and background worker
# (agent scheduler, topic monitor, proactive observer). Does NOT deploy
# the PyQt6 desktop app or its voice loop; see the J2 report for why that
# split exists (main.py still imports PyQt6/sounddevice at module scope).
#
# Python version is pinned via .python-version at the repo root (Render
# reads it automatically) rather than duplicated here.
services:
  - type: web
    name: jarvis-headless-core
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m core.headless_main
    healthCheckPath: /health
    disk:
      # Persistent volume for data/jarvis2.db, the agent-scheduler lock,
      # and everything else core/headless/config.py's DATA_DIR covers —
      # survives restarts/redeploys, unlike the container's own
      # filesystem. JARVIS_DATA_DIR below points at this exact mount path.
      name: jarvis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JARVIS_API_TOKEN
        sync: false   # set as a real secret in the Render dashboard, never committed
      - key: GEMINI_API_KEY
        sync: false   # set as a real secret in the Render dashboard, never committed
      - key: JARVIS_HEADLESS_HOST
        value: "0.0.0.0"
      - key: JARVIS_DATA_DIR
        value: "/var/data"
      # No JARVIS_HEADLESS_PORT here — core/headless/config.py falls back
      # to Render's own $PORT automatically when that's unset.
