# Render deployment config for the headless JARVIS core only — the
# tool-execution API, Agent Orchestrator API, and background worker
# (agent scheduler, topic monitor, proactive observer). Does NOT deploy
# the PyQt6 desktop app or its voice loop; see the J2 report for why that
# split exists (main.py still imports PyQt6/sounddevice at module scope).
#
# Python version is pinned via .python-version at the repo root (Render
# reads it automatically) rather than duplicated here.
#
# J4 decision: Free plan, no disk, for a short-term proof-of-life test —
# not a persistence story for anything durable. Free web services have no
# persistent disk option at any price point below Starter, and the intent
# here is explicitly $0. JARVIS_DATA_DIR is left unset on purpose so
# DATA_DIR falls back to config.py's local-dev default (plain ephemeral
# storage inside the container) — data survives across requests within a
# single running instance, but is wiped on every restart/redeploy/sleep
# cycle. When this moves to a permanent host, re-add a `disk:` block
# (Starter plan or above) and set JARVIS_DATA_DIR to its mount path.
services:
  - type: web
    name: jarvis-headless-core
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-headless.txt
    startCommand: python -m core.headless_main
    healthCheckPath: /health
    envVars:
      - key: JARVIS_API_TOKEN
        sync: false   # set as a real secret in the Render dashboard, never committed
      # Ollama Cloud is the sole LLM provider (see ui.py's
      # _configured_providers). The key is a real secret set in the Render
      # dashboard; URL and model are plain config so a model swap is an
      # env edit, not a deploy of new code.
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_URL
        value: "https://ollama.com/api/chat"
      - key: OLLAMA_MODEL
        value: "gpt-oss:120b-cloud"
      - key: GROQ_API_KEY
        sync: false   # set as a real secret in the Render dashboard, never committed —
                       # the zero-cost primary provider; see core/headless/ui.py's
                       # _configured_providers() for the Groq -> Gemini -> Anthropic order
      - key: GEMINI_API_KEY
        sync: false   # set as a real secret in the Render dashboard, never committed —
                       # optional fallback once GROQ_API_KEY is set; JARVIS no longer
                       # requires this to operate
      # Cartesia — one voice across both surfaces. CARTESIA_API_KEY alone
      # is enough for the browser /ui to speak with Sonic and for the
      # phone agent to reach this service; the AGENT_ID/PHONE_NUMBER_ID
      # pair is only needed for JARVIS to place outbound calls himself
      # (see actions/cartesia_calls.py). Set them after `cartesia deploy`
      # and after a number is provisioned — voice_agent/README.md has the
      # order. All secrets, none committed.
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false   # same id the Line agent uses, or JARVIS is two voices
      - key: CARTESIA_AGENT_ID
        sync: false
      - key: CARTESIA_PHONE_NUMBER_ID
        sync: false
      - key: JARVIS_OWNER_PHONE
        sync: false   # E.164, e.g. +13125550142 — where "call me" rings
      - key: JARVIS_HEADLESS_HOST
        value: "0.0.0.0"
      # No JARVIS_HEADLESS_PORT here — core/headless/config.py falls back
      # to Render's own $PORT automatically when that's unset.
